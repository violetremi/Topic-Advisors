<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大内密探 - 企业情报分析系统</title>
  <style>
    /* Markdown 报告内容样式 */
    .report-content h1 { font-size: 22px; font-weight: 700; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; color: #1a1a1a; }
    .report-content h2 { font-size: 18px; font-weight: 600; margin: 20px 0 10px; padding-left: 10px; border-left: 3px solid #1677ff; color: #262626; }
    .report-content h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: #434343; }
    .report-content p { line-height: 1.8; margin: 8px 0; color: #434343; font-size: 14px; }
    .report-content ul, .report-content ol { padding-left: 22px; margin: 8px 0; line-height: 1.8; }
    .report-content li { margin: 4px 0; color: #434343; }
    .report-content blockquote { margin: 12px 0; padding: 8px 16px; border-left: 4px solid #1677ff; background: #f6f8ff; border-radius: 0 6px 6px 0; color: #555; }
    .report-content strong { color: #1a1a1a; font-weight: 700; }
    .report-content code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 13px; border: 1px solid #e8e8e8; }
    .report-content pre { background: #f6f8fa; padding: 14px 16px; border-radius: 6px; overflow-x: auto; border: 1px solid #e8e8e8; margin: 12px 0; }
    .report-content pre code { background: none; border: none; padding: 0; font-size: 13px; }
    .report-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
    .report-content th { background: #fafafa; font-weight: 600; padding: 8px 12px; border: 1px solid #f0f0f0; text-align: left; }
    .report-content td { padding: 8px 12px; border: 1px solid #f0f0f0; }
    .report-content hr { margin: 20px 0; border: none; border-top: 1px solid #f0f0f0; }
    .report-content think { display: none; } /* 隐藏模型的思考过程标签 */
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
